<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
<title>Activate StratoBot</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; background: #0e1420; color: #ebe6dc; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  main { width: 400px; display: flex; flex-direction: column; gap: 16px; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: rgba(235,230,220,.75); }
  label { font-weight: 600; font-size: 13px; }
  input { font: 16px ui-monospace, Consolas, monospace; letter-spacing: .04em; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c3546; background: #161e2d; color: #ebe6dc; text-transform: uppercase; }
  input:focus { outline: 1px solid #e08a5c; }
  button { font: 600 14px system-ui, "Segoe UI", sans-serif; padding: 11px 14px; border-radius: 8px; border: 0; cursor: pointer; }
  .primary { background: #e08a5c; color: #0e1420; }
  .primary:disabled { opacity: .6; cursor: default; }
  .ghost { background: transparent; color: #e08a5c; border: 1px solid #2c3546; }
  .error { color: #e57373; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <img src="build/icon.png" alt="" />
  <h1>Activate StratoBot</h1>
  <p>Paste the licence key you got after paying. One key works on up to 2 PCs.</p>
  <form id="form" style="display:flex;flex-direction:column;gap:8px">
    <label for="key">Licence key</label>
    <input id="key" autocomplete="off" spellcheck="false" placeholder="SBD-XXXX-XXXX-XXXX-XXXX" autofocus />
    <p id="error" class="error" role="alert"></p>
    <button id="go" class="primary" type="submit">Activate</button>
  </form>
  <p>No key yet?</p>
  <button id="buy" class="ghost" type="button">Buy a licence on stratobot.trade</button>
</main>
<script src="activate.js"></script>
</body>
</html>
